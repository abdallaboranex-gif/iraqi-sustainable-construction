[theme]
# اللون الأساسي للأزرار وعلامات الاختيار النشطة والخطوط الزمنية
primaryColor = "#00FFCC" 

# لون الخلفية الرئيسي للمنصة (داكن ومريح للعين كما في الصورة المرجعية)
backgroundColor = "#0F172A" 

# لون الخلفيات الفرعية والكروت الإحصائية والحاويات الجانبية
secondaryBackgroundColor = "#1E293B" 

# لون النصوص والبيانات والأرقام الرئيسية المكتوبة داخل المنصة
textColor = "#F8FAFC" 

# نوع الخط المعتمد لقراءة النصوص العربية والكردية والإنكليزية بوضوح
font = "sans serif"

[server]
# تفعيل الحد الأقصى لحجم رفع الملفات (مخططات الـ CAD وتقارير الـ PDF) حتى 50 ميجابايت
maxUploadSize = 50
