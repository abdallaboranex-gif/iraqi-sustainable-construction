[theme]
# اللون الأساسي للأزرار والخطوط الزمنية وعلامات النجاح (الأخضر الزمردي الفخم)
primaryColor = "#10B981" 

# لون الخلفية الرئيسي للمنصة (أزرق ملكي داكن ومخملي)
backgroundColor = "#0A0F1D" 

# لون الكروت الإحصائية ولوحة المؤشرات الجانبية والحاويات (كحلي مطفأ وعميق)
secondaryBackgroundColor = "#151F32" 

# لون النصوص والبيانات الرئيسية (أبيض ثلجي مريح جداً للقراءة)
textColor = "#F8FAFC" 

# نوع الخط المعتمد لضمان الانسيابية الهندسية
font = "sans serif"

[server]
maxUploadSize = 50
