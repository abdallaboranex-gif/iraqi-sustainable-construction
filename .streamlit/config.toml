[theme]
# اللون الأساسي للأزرار وعلامات النجاح والخطوط الزمنية (الأزرق الملكي المشرق)
primaryColor = "#1D4ED8" 

# لون الخلفية الرئيسي للمنصة (أبيض ناصع وناعم كما في الصورة)
backgroundColor = "#F8FAFC" 

# لون الخلفيات الفرعية للكروت الإحصائية والحاويات الجانبية (رمادي ثلجي خفيف جدًا)
secondaryBackgroundColor = "#FFFFFF" 

# لون النصوص والعناوين الرئيسية (كحلي داكن شديد الوضوح والفخامة)
textColor = "#0F172A" 

# نوع الخط المعتمد لقراءة النصوص بانسيابية
font = "sans serif"

[server]
maxUploadSize = 50
